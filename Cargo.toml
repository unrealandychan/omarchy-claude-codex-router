[package]
name = "omarchy-claude-codex-router"
version = "1.1.1"
edition = "2021"
authors = ["Eddie Chan <eddie.chan@connect.ust.hk>"]
description = "Vertex AI Gemini Router for Claude Code & OpenAI Codex in Rust"
license = "MIT"
repository = "https://github.com/unrealandychan/omarchy-claude-codex-router"

[lib]
name = "omarchy_claude_codex_router"
path = "src/lib.rs"

[[bin]]
name = "claude-gemini-router"
path = "src/bin/claude-gemini-router.rs"

[[bin]]
name = "omarchy-gemini-router-ctl"
path = "src/bin/omarchy-gemini-router-ctl.rs"

[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
futures-util = "=0.3.34"
http = "=1.5.0"
httparse = "=1.10.1"
libc = "=0.2.190"
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_urlencoded = "=0.7.1"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
urlencoding = "=2.1.3"
uuid = { version = "=1.27.0", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
