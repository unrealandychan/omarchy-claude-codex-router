[project]
name = "claude-gemini-adc-router"
version = "0.2.0"
description = "Keyless (ADC-only) Anthropic Messages & OpenAI Responses/Chat API router for Claude Code and OpenAI Codex targeting Gemini 3.8 and Gemini 4.0 on Vertex AI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Eddie Chan", email = "admin@eddieckc.altostrat.com" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "requests>=2.32.0",
    "uvicorn>=0.32.0",
]

[project.urls]
Homepage = "https://github.com/eddieckc/claude-gemini-adc-router"
Repository = "https://github.com/eddieckc/claude-gemini-adc-router"
Issues = "https://github.com/eddieckc/claude-gemini-adc-router/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
claude-gemini-router = "router.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router"]

[tool.pytest.ini_options]
pythonpath = ["."]

